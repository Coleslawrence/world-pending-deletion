# Checks every pull request: content mistakes, crashes in play, and balance against the base branch.
# What each check catches and how to run it locally: docs/CONTENT.md, "Checks".
name: Checks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  content:
    name: Content and smoke sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Content checker
        run: node tools/check-content.js
      - name: Entrant pool reserves
        run: node tools/pool-seed.js --check
      - name: Smoke sim (200 seeded bot runs)
        run: node tools/stats.js 200 --seed 1
      - name: Pending World checks
        run: node tools/daily.js 2026-11-01
      - name: World Record checks
        run: node tools/record.js
      - name: Dice checks (Gambler)
        run: node tools/dice-test.js
      - name: Jinx checks
        run: node tools/jinx-test.js
      - name: Ally pieces test
        run: node tools/ally-pieces-test.js
      - name: Opening draft test
        run: node tools/draft-test.js
      - name: Steer the next world test
        run: node tools/steer-test.js
      - name: Read skills test
        run: node tools/read-test.js
      - name: Reflex test
        run: node tools/reflex-test.js
      - name: Wind-up test
        run: node tools/windup-test.js
      - name: Weighted moves test
        run: node tools/moves-test.js
      - name: Path evolution test
        run: node tools/advance-test.js
      - name: Prefix test
        run: node tools/prefix-test.js
      - name: End screen progress test
        run: node tools/progress-test.js
      - name: Spoils test
        run: node tools/spoils-test.js
      - name: World bounty test
        run: node tools/bounty-test.js
      - name: Back yourself test
        run: node tools/backing-test.js
      - name: Run shape test
        run: node tools/runshape-test.js
      - name: Bracket map test
        run: node tools/bracket-test.js
      - name: Ladder test
        run: node tools/ladder-test.js
      - name: Mastery test
        run: node tools/mastery-test.js
      - name: Designs test
        run: node tools/designs-test.js
      - name: Clauses test
        run: node tools/clauses-test.js
      - name: Goals test
        run: node tools/goals-test.js
      - name: Rival grudges test
        run: node tools/grudges-test.js

  balance:
    name: Balance gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check out the base branch beside this one
        run: git worktree add ../base ${{ github.event.pull_request.base.sha }}
      # Label the pull request balance-change when moving the numbers is the point: the gate then reports without failing
      - name: Balance gate (same seeded bot runs on the base branch and this one)
        run: node tools/balance-gate.js ../base . ${{ contains(github.event.pull_request.labels.*.name, 'balance-change') && '--report-only' || '' }}
